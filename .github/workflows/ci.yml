name: Build Docker and Upload to Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string

# 仓库默认 token 只有 read 权限，创建 GitHub Release 需要显式申请 contents: write
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Get Latest HBuilderX Versions
        id: get-versions
        run: |
          version=$(cat versions.json | jq -r '.[0].version')
          url="$(cat versions.json | jq -r '.[0].url')"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "url=$url" >> $GITHUB_OUTPUT
          if git ls-remote --tags origin | grep -q "refs/tags/v${version}$"; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.get-versions.outputs.should_skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Download HBuilderX ${{ steps.get-versions.outputs.version }}
        if: steps.get-versions.outputs.should_skip != 'true'
        run: |
          # wget 在非交互终端上的进度条会往日志刷出大量行，因此静默下载并定期报告已下载大小
          wget -q -O ./hbuilderx.tar.gz "${{ steps.get-versions.outputs.url }}" &
          wget_pid=$!
          echo "⏳ Downloading HBuilderX..."
          while kill -0 "$wget_pid" 2>/dev/null; do
            sleep 20
            echo "   downloaded: $(du -h ./hbuilderx.tar.gz 2>/dev/null | cut -f1)"
          done
          wait "$wget_pid"

          mkdir -p ./.cache/hbuilderx
          tar -xzf hbuilderx.tar.gz -C ./.cache/hbuilderx --strip-components=1

      - name: Build full Docker image
        if: steps.get-versions.outputs.should_skip != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t hbuilderx:${{ steps.get-versions.outputs.version }} \
            --build-arg HBUILDERX_PATH=./.cache/hbuilderx \
            --build-arg SLIM=false \
            --output type=docker,dest=./hbuilderx.${{ steps.get-versions.outputs.version }}.tar \
            .

      - name: Build slim Docker image
        if: steps.get-versions.outputs.should_skip != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t hbuilderx:${{ steps.get-versions.outputs.version }} \
            --build-arg HBUILDERX_PATH=./.cache/hbuilderx \
            --build-arg SLIM=true \
            --output type=docker,dest=./hbuilderx.${{ steps.get-versions.outputs.version }}-slim.tar \
            .

      - name: Create GitHub Release
        if: steps.get-versions.outputs.should_skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./hbuilderx.${{ steps.get-versions.outputs.version }}.tar
            ./hbuilderx.${{ steps.get-versions.outputs.version }}-slim.tar
          prerelease: ${{ contains(steps.get-versions.outputs.version, '-alpha') }}
          name: v${{ steps.get-versions.outputs.version }}
          tag_name: v${{ steps.get-versions.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## HBuilderX Docker Images

            This release contains Docker images for HBuilderX.

            - hbuilderx.\<version\>.tar: Docker image for HBuilderX Stable version
            - hbuilderx.\<version\>-slim.tar: Slim Docker image for HBuilderX Stable version
            - hbuilderx.\<version\>-alpha.tar: Docker image for HBuilderX Alpha version
            - hbuilderx.\<version\>-alpha-slim.tar: Slim Docker image for HBuilderX Alpha version

            ### Usage

            To load the Docker image, use the following command:

            ```bash
            docker load -i hbuilderx.<version>.tar
            ```

            After loading the image, you can run the container using:

            ```bash
            docker run -it hbuilderx:${{ steps.get-versions.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
